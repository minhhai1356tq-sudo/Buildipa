name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: false
        type: string
        default: ''
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate iOS files
        run: flutter create . --platforms=ios --project-name=nativetavern || true

      - name: Disable code signing
        run: |
          set -e
          cd ios
          # Tắt yêu cầu signing trong project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution"/CODE_SIGN_IDENTITY = ""/g' Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj || true
          echo "Code signing disabled in project.pbxproj"
          grep -n "CODE_SIGN\|DEVELOPMENT_TEAM" Runner.xcodeproj/project.pbxproj | head -20 || true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Locate built app
        id: locate
        run: |
          set -e
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app"
            ls -la build/ios/ || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Create IPA
        run: |
          set -e
          mkdir -p build/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" build/Payload/
          cd build
          zip -rq app.ipa Payload
          rm -rf Payload
          echo "Created IPA: build/app.ipa"
          ls -lh app.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/app.ipa
          retention-days: 7