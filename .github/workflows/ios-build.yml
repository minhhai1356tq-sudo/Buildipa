name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: false
        type: string
        default: ''
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate iOS files
        run: flutter create . --platforms=ios --project-name=nativetavern || true

      # === BƯỚC QUAN TRỌNG: XÓA HOÀN TOÀN CẤU HÌNH SIGNING ===
      - name: Strip all signing configurations from Xcode project
        run: |
          set -e
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          echo "Stripping signing configs from $PBXPROJ..."
          # Xóa dòng DEVELOPMENT_TEAM
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBXPROJ"
          # Xóa dòng CODE_SIGN_IDENTITY
          sed -i '' '/CODE_SIGN_IDENTITY/d' "$PBXPROJ"
          # Xóa dòng CODE_SIGNING_REQUIRED
          sed -i '' '/CODE_SIGNING_REQUIRED/d' "$PBXPROJ"
          # Xóa dòng CODE_SIGNING_ALLOWED
          sed -i '' '/CODE_SIGNING_ALLOWED/d' "$PBXPROJ"
          # Xóa dòng CODE_SIGN_STYLE
          sed -i '' '/CODE_SIGN_STYLE/d' "$PBXPROJ"
          # Xóa dòng PROVISIONING_PROFILE_SPECIFIER
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$PBXPROJ"
          echo "=== Remaining signing-related lines (should be empty) ==="
          grep -n "DEVELOPMENT_TEAM\|CODE_SIGN\|PROVISIONING_PROFILE" "$PBXPROJ" || echo "None found. Good."

      # === BƯỚC QUAN TRỌNG: PATCH PODFILE ĐỂ TẮT SIGNING CHO PODS ===
      - name: Patch Podfile to disable code signing for Pods
        run: |
          set -e
          PODFILE="ios/Podfile"
          if [ ! -f "$PODFILE" ]; then
            echo "::error::Podfile not found at $PODFILE"
            exit 1
          fi
          # Kiểm tra xem đã có post_install chưa
          if grep -q "post_install" "$PODFILE"; then
            echo "Podfile already has post_install block. Replacing it..."
            # Xóa post_install cũ (đơn giản hóa, giả sử nó nằm ở cuối file)
            # Cách an toàn hơn: dùng Python để chèn
            python3 - <<'PY'
          import re
          with open('ios/Podfile', 'r') as f:
              content = f.read()
          # Xóa post_install cũ (nếu có) - giả định nó bắt đầu bằng "post_install do |installer|"
          # và kết thúc bằng "end" ở cùng mức thụt lề.
          # Cách đơn giản: thay thế toàn bộ block post_install bằng block mới
          # Tìm và thay thế từ "post_install do |installer|" đến "end" gần nhất
          pattern = r'post_install do \|installer\|.*?end'
          replacement = '''post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
            end
          end'''
          content = re.sub(pattern, replacement, content, flags=re.DOTALL)
          with open('ios/Podfile', 'w') as f:
              f.write(content)
          print("Podfile patched.")
          PY
          else
            echo "Adding new post_install block to Podfile..."
            cat >> "$PODFILE" <<'EOF'

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
            end
          end
          EOF
          fi
          echo "=== Podfile content (last 20 lines) ==="
          tail -n 20 "$PODFILE"

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Locate built app
        id: locate
        run: |
          set -e
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app"
            ls -la build/ios/ || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Create IPA
        run: |
          set -e
          mkdir -p build/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" build/Payload/
          cd build
          zip -rq app.ipa Payload
          rm -rf Payload
          echo "Created IPA: build/app.ipa"
          ls -lh app.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/app.ipa
          retention-days: 7