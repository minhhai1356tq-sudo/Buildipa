name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: false
        type: string
        default: ''
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Regenerate iOS files
        run: flutter create . --platforms=ios --project-name=nativetavern || true

      # BƯỚC QUAN TRỌNG: Xóa hoàn toàn cấu hình signing trong project.pbxproj
      - name: Strip all signing configurations from Xcode project
        run: |
          set -e
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          echo "Stripping signing configs from $PBXPROJ..."
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_IDENTITY/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGNING_REQUIRED/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGNING_ALLOWED/d' "$PBXPROJ"
          sed -i '' '/CODE_SIGN_STYLE/d' "$PBXPROJ"
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' "$PBXPROJ"
          echo "=== Remaining signing-related lines (should be empty) ==="
          grep -n "DEVELOPMENT_TEAM\|CODE_SIGN\|PROVISIONING_PROFILE" "$PBXPROJ" || echo "None found. Good."

      # BƯỚC QUAN TRỌNG: Tạo file Podfile tùy chỉnh với post_install đã được viết sẵn
      - name: Overwrite Podfile with custom configuration to disable code signing
        run: |
          set -e
          echo "Writing custom Podfile to ios/Podfile..."
          cat > ios/Podfile <<'EOF'
          # Custom Podfile for unsigned builds
          # Disables code signing for all Pod targets to prevent 'Development Team Required' errors.

          platform :ios, '13.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end

            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
                config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                config.build_settings['DEVELOPMENT_TEAM'] = ''
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''
              end
            end
          end
          EOF
          echo "=== Custom Podfile written successfully ==="
          cat ios/Podfile

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Locate built app
        id: locate
        run: |
          set -e
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app"
            ls -la build/ios/ || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Create IPA
        run: |
          set -e
          mkdir -p build/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" build/Payload/
          cd build
          zip -rq app.ipa Payload
          rm -rf Payload
          echo "Created IPA: build/app.ipa"
          ls -lh app.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/app.ipa
          retention-days: 7