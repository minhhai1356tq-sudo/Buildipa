name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: false
        type: string
        default: ''
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          set -e
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -rq app.ipa Payload
          rm -rf Payload
          echo "Created IPA: build/app.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/app.ipa
          retention-days: 7